<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Jornada da Sustentabilidade</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
body {
    background: linear-gradient(135deg, #1e3a5f 0%, #2c5364 100%);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}
.container { width: 100%; max-width: 400px; }
a.voltar {
    color: white;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 20px;
}
h1 {
    text-align: center;
    color: white;
    margin-bottom: 30px;
    font-size: 1.6rem;
}
.card {
    background: white;
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: #333;
}
input[type="email"], input[type="password"] {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 2px solid #ddd;
    border-radius: 6px;
    font-size: 16px;
}
.lembrar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
}
.lembrar input {
    width: 20px;
    height: 20px;
    cursor: pointer;
}
button {
    width: 100%;
    padding: 14px;
    background: #27ae60;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 18px;
    cursor: pointer;
}
button:hover { background: #219653; }
p.links {
    text-align: center;
    margin-top: 20px;
}
p.links a {
    color: #27ae60;
    text-decoration: none;
}
</style>
</head>
<body>
<div class="container">

<a href="index.html" class="voltar">← Voltar</a>
<h1>🔐 Acesse sua Conta</h1>

<div class="card">
<label for="email">E-mail</label>
<input type="email" id="email" placeholder="seu@email.com">

<label for="senha">Senha</label>
<input type="password" id="senha" placeholder="Sua senha">

<div class="lembrar">
<input type="checkbox" id="caixaLembrar">
<label for="caixaLembrar" style="font-weight:normal">Manter conectado</label>
</div>

<button onclick="entrar()">Entrar</button>

<p class="links">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
</div>

</div>

<script>
window.onload = function() {
    if (localStorage.getItem('logado') === 'sim') {
        window.location.href = 'conta.html';
    }
};

function entrar() {
    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;
    const lembrar = document.getElementById('caixaLembrar').checked;

    if (!email || !senha) {
        alert('Preencha todos os campos!');
        return;
    }

    if (lembrar) {
        localStorage.setItem('logado', 'sim');
        localStorage.setItem('usuario', email);
    } else {
        sessionStorage.setItem('logado', 'sim');
        sessionStorage.setItem('usuario', email);
    }

    window.location.href = 'conta.html';
}
</script>

</body>
</html>
